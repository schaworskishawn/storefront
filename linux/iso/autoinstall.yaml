# The installer file put at the root of the Worldwide AI OS image. Ubuntu's desktop installer reads it from there.
#
# It automates nothing a person should decide. Every section listed under interactive-sections is shown to the person
# installing, with the values below only as suggestions: they choose the disk and review the storage plan before anything
# is written, and they create their own Linux account. What it adds is the last step: installing the Worldwide AI packages
# from the image itself, so no internet is needed for them.
autoinstall:
  version: 1
  interactive-sections:
    - locale
    - keyboard
    - network
    - storage
    - identity
    - timezone
  source:
    id: ubuntu-desktop-minimal
  timezone: America/Winnipeg
  late-commands:
    # The image is mounted at /cdrom while the installer runs, and the installed system at /target.
    - mkdir -p /target/var/cache/worldwide-ai/install
    - cp /cdrom/worldwide-ai/*.deb /target/var/cache/worldwide-ai/install/
    # dpkg installs exactly these files and fetches nothing; if one needs something the system lacks, it fails and the
    # installer stops and says so. (apt-get --no-download refuses local files too: tried in 0.0.1, it failed.)
    - curtin in-target -- sh -c 'dpkg -i /var/cache/worldwide-ai/install/*.deb'
    - curtin in-target -- sh -c 'dpkg-query -W -f "\${Package} \${Version} \${Status}\n" "worldwide-ai-*" > /var/log/worldwide-ai-install.log'
    # Stops the installer unless at least one package was installed and every one of them is fully installed.
    - curtin in-target -- sh -c 'test -s /var/log/worldwide-ai-install.log && ! grep -v " install ok installed$" /var/log/worldwide-ai-install.log'
    - rm -rf /target/var/cache/worldwide-ai/install
