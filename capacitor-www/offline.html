<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#05030a" />
		<title>Worldwide Vapor</title>
		<style>
			:root {
				--bg: #05030a;
				--surface: #0f0f14;
				--cyan: #00e5ff;
				--text: #b8b4c4;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			main {
				min-height: 100dvh;
				display: grid;
				place-content: center;
				gap: 16px;
				padding: 32px 24px;
				text-align: center;
			}
			h1 {
				margin: 0;
				color: #fff;
				font-size: 22px;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			p {
				margin: 0;
				max-width: 28ch;
				line-height: 1.5;
			}
			button {
				justify-self: center;
				border: 1px solid var(--cyan);
				border-radius: 12px;
				background: transparent;
				color: var(--cyan);
				padding: 12px 28px;
				font: inherit;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				box-shadow: 0 0 14px rgba(0, 229, 255, 0.25);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>Worldwide Vapor needs a connection to load. Check your signal and try again.</p>
			<!-- Reloading would only reload this page; send the shopper back to the site. (Production URL — keep in step with capacitor.config.ts.) -->
			<button type="button" onclick="location.href = 'https://www.worldwidevapor.com'">Try again</button>
		</main>
	</body>
</html>
