query ProductDetails($slug: String!, $channel: String!, $languageCode: LanguageCodeEnum!) {
	product(slug: $slug, channel: $channel) {
		id
		name
		slug
		description
		seoTitle
		seoDescription
		# Questions and answers for the product page's FAQ and its FAQPage structured data: a JSON array of
		# {"q": "...", "a": "..."} in the product's public metadata (see src/lib/catalog/product-faq.ts).
		faq: metafield(key: "faq")
		# A companion guide linked from the FAQ: {"url": "/learn/…", "title": "…"} (src/lib/catalog/product-guide.ts).
		guide: metafield(key: "guide")
		translation(languageCode: $languageCode) {
			name
			description
			seoTitle
			seoDescription
		}
		thumbnail(size: 2048, format: WEBP) {
			url
			alt
		}
		media {
			url(size: 2048, format: WEBP)
			alt
			type
		}
		category {
			id
			name
			slug
			translation(languageCode: $languageCode) {
				name
			}
		}
		# Bestseller merchandising flag — fetch only the boolean by slug (new attribute API).
		# Slugs must match PRODUCT_FLAG_SLUGS in src/lib/catalog/product-flags.ts.
		bestseller: assignedAttribute(slug: "bestseller") {
			... on AssignedBooleanAttribute {
				value
			}
		}
		pulseBestseller: assignedAttribute(slug: "pulse-bestseller") {
			... on AssignedBooleanAttribute {
				value
			}
		}
		# Spec accordion / care copy still read the full (deprecated) attribute list.
		# TODO: migrate to `assignedAttributes` in a dedicated attribute-API sweep.
		attributes {
			values {
				name
				translation(languageCode: $languageCode) {
					name
				}
			}
			attribute {
				name
				slug
				translation(languageCode: $languageCode) {
					name
				}
			}
		}
		variants {
			...VariantDetails
		}
		pricing {
			priceRange {
				start {
					gross {
						amount
						currency
					}
				}
				stop {
					gross {
						amount
						currency
					}
				}
			}
		}
	}
}
