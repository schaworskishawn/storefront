query ProductList($first: Int = 9, $after: String, $channel: String!, $languageCode: LanguageCodeEnum!) {
	products(first: $first, after: $after, channel: $channel) {
		pageInfo {
			hasNextPage
			endCursor
		}
		edges {
			node {
				...ProductListItem
				# Shop filters (src/lib/catalog/product-facets.ts picks the few slugs it needs from these).
				productType {
					name
				}
				attributes {
					attribute {
						slug
					}
					values {
						name
					}
				}
				variants {
					attributes(variantSelection: VARIANT_SELECTION) {
						attribute {
							slug
						}
						values {
							name
						}
					}
				}
			}
		}
	}
}
