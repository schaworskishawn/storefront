<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#05030a" />
		<title>Worldwide AI</title>
		<style>
			:root {
				--bg: #05030a;
				--cyan: #69ebff;
				--pink: #f179fb;
				--text: #c9c3d6;
				--muted: #8a8398;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			main {
				min-height: 100dvh;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 16px;
				padding: 32px 24px;
				text-align: center;
			}
			svg {
				color: var(--cyan);
			}
			section {
				display: grid;
				justify-items: center;
				gap: 12px;
			}
			h1 {
				margin: 0;
				color: #fff;
				font-size: 18px;
				font-weight: 500;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				text-wrap: balance;
			}
			p {
				margin: 0;
				max-width: 32ch;
				line-height: 1.5;
				text-wrap: pretty;
			}
			.detail {
				max-width: 36ch;
				color: var(--muted);
				font-family: ui-monospace, "Cascadia Mono", monospace;
				font-size: 12px;
				overflow-wrap: anywhere;
			}
			button {
				border: 1px solid var(--cyan);
				border-radius: 12px;
				background: transparent;
				color: var(--cyan);
				padding: 12px 28px;
				font: inherit;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 30%, transparent);
			}
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<!--
			The app (MainActivity.java) shows this page only when a page of the site didn't arrive at all: an answer from the
			site, even an error, is shown as the site sent it. Once this page has loaded, the app hands it what went wrong and
			where (showDetail: "net::ERR_… · host/path"); Capacitor serves it only at exactly its address, so not in a query.
			This page then checks whether the site answers at all, to tell "no connection" from "the site is
			up, but that page failed". Addresses are production; keep them in step with capacitor.config.ts.
		-->
		<main>
			<svg width="60" height="48" viewBox="0 0 30 24" aria-hidden="true">
				<path
					d="M2 3 L8.5 21 L15 7 L21.5 21 L28 3"
					fill="none"
					stroke="currentColor"
					stroke-width="2.6"
					stroke-linejoin="round"
					stroke-linecap="round"
				/>
			</svg>
			<section id="checking">
				<h1>Opening Worldwide AI</h1>
			</section>
			<section id="offline" hidden>
				<h1>Can't reach Worldwide AI</h1>
				<p>The phone can't reach worldwidevapor.com. Check your connection and try again.</p>
			</section>
			<section id="failed" hidden>
				<h1>That page didn't load</h1>
				<p>
					worldwidevapor.com is up, but this page couldn't be loaded. Try again; if it keeps happening, send
					the line below.
				</p>
			</section>
			<p class="detail" id="detail" hidden></p>
			<button type="button" onclick="location.href = 'https://www.worldwidevapor.com/worldwide-ai/desktop'">
				Try again
			</button>
		</main>
		<script>
			// The app calls this once the page has loaded, with what went wrong and where. Text only.
			window.showDetail = (text) => {
				const detail = document.getElementById("detail");
				detail.textContent = String(text);
				detail.hidden = false;
			};
			const show = (id) => {
				for (const section of ["checking", "offline", "failed"]) {
					document.getElementById(section).hidden = section !== id;
				}
			};
			// Reachable at all? A no-cors request settles without reading anything: it fails only when nothing answers.
			fetch("https://www.worldwidevapor.com/worldwide-ai/manifest.webmanifest", {
				mode: "no-cors",
				cache: "no-store",
			})
				.then(() => show("failed"))
				.catch(() => show("offline"));
		</script>
	</body>
</html>
