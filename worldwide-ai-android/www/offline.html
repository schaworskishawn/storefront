<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#05030a" />
		<title>Worldwide AI</title>
		<style>
			:root {
				--bg: #05030a;
				--cyan: #69ebff;
				--pink: #f179fb;
				--text: #c9c3d6;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			main {
				min-height: 100dvh;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 16px;
				padding: 32px 24px;
				text-align: center;
			}
			svg {
				color: var(--cyan);
			}
			h1 {
				margin: 0;
				color: #fff;
				font-size: 20px;
				font-weight: 500;
				letter-spacing: 0.24em;
				text-transform: uppercase;
			}
			p {
				margin: 0;
				max-width: 30ch;
				line-height: 1.5;
			}
			button {
				border: 1px solid var(--cyan);
				border-radius: 12px;
				background: transparent;
				color: var(--cyan);
				padding: 12px 28px;
				font: inherit;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 30%, transparent);
			}
		</style>
	</head>
	<body>
		<main>
			<svg width="60" height="48" viewBox="0 0 30 24" aria-hidden="true">
				<path
					d="M2 3 L8.5 21 L15 7 L21.5 21 L28 3"
					fill="none"
					stroke="currentColor"
					stroke-width="2.6"
					stroke-linejoin="round"
					stroke-linecap="round"
				/>
			</svg>
			<h1>Can't reach Worldwide AI</h1>
			<p>The app needs a connection to open your workspace. Check your signal and try again.</p>
			<!-- Reloading would only reload this page; go back to the desktop. (Keep in step with capacitor.config.ts.) -->
			<button type="button" onclick="location.href = 'https://www.worldwidevapor.com/worldwide-ai/desktop'">
				Try again
			</button>
		</main>
	</body>
</html>
